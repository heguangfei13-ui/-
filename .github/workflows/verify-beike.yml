name: Verify Beike official API access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-beike.yml'
      - 'scripts/beike_probe.py'
      - 'tests/test_beike_probe.py'
permissions:
  contents: read
concurrency:
  group: beike-access-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded requests and secret-safe reporting
        run: python -m unittest tests/test_beike_probe.py
      - name: Verify OAuth and two city transaction queries
        env:
          BEIKE_APP_KEY: ${{ secrets.BEIKE_APP_KEY }}
          BEIKE_APP_SECRET: ${{ secrets.BEIKE_APP_SECRET }}
        run: python scripts/beike_probe.py

