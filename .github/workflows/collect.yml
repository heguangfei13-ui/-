name: Collect official housing snapshots
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      refresh_amap:
        description: Force AMap refresh (otherwise respect the seven-day cache)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: housing-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parsers against archived fixtures
        run: python -m unittest tests/test_collect.py
      - name: Fetch, validate, archive and ingest
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          FORCE_AMAP: ${{ github.event.inputs.refresh_amap == 'true' && '1' || '0' }}
        run: python scripts/collect.py
      - name: Commit immutable collection record
        if: always()
        run: |
          git config user.name "home-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive
          if test -f data/amap-latest.json; then git add data/amap-latest.json; fi
          git diff --cached --quiet || git commit -m "data: archive official snapshots $(date +%F)"
          git push
